name: Bump submodule in deepseek-harness-plugins

# Every push to main opens or updates a PR in n0pe-sled/deepseek-harness-plugins
# that moves this plugin's submodule pointer to the pushed commit.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

env:
  PARENT_REPO: n0pe-sled/deepseek-harness-plugins
  PLUGIN_PATH: skill-mcp-manager

jobs:
  bump-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Bump submodule pointer via PR
        env:
          GH_TOKEN: ${{ secrets.PARENT_TOKEN }}
        run: |
          set -euo pipefail
          branch="bump/${PLUGIN_PATH}"

          rm -rf parent
          git clone --depth 25 "https://x-access-token:${GH_TOKEN}@github.com/${PARENT_REPO}.git" parent
          cd parent
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only act once the plugin is wired up as a submodule in the parent.
          mode="$(git ls-files --stage -- "${PLUGIN_PATH}" | awk '{print $1; exit}')"
          if [ "${mode}" != "160000" ]; then
            echo "${PLUGIN_PATH} is not a submodule in ${PARENT_REPO} (index mode: ${mode:-absent}); nothing to do."
            exit 0
          fi

          # The pushed commit must still exist in this repo (guards force-push races).
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .sha >/dev/null 2>&1; then
            echo "Commit ${GITHUB_SHA} not found in ${GITHUB_REPOSITORY}; skipping."
            exit 0
          fi

          git update-index --cacheinfo "160000,${GITHUB_SHA},${PLUGIN_PATH}"
          if git diff --cached --quiet; then
            echo "Submodule already at ${GITHUB_SHA}; nothing to do."
            exit 0
          fi
          git commit -m "chore(${PLUGIN_PATH}): bump submodule to ${GITHUB_SHA}"
          git push --force origin "HEAD:refs/heads/${branch}"

          pr="$(gh pr list --repo "${PARENT_REPO}" --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${pr}" ]; then
            gh pr comment "${pr}" --repo "${PARENT_REPO}" --body "Updated to ${GITHUB_SHA} (from ${GITHUB_REPOSITORY} push)."
          else
            gh pr create --repo "${PARENT_REPO}" \
              --base main --head "${branch}" \
              --title "chore(${PLUGIN_PATH}): bump submodule to ${GITHUB_SHA}" \
              --body "Push to \`main\` of ${GITHUB_REPOSITORY} moved the \`${PLUGIN_PATH}\` submodule to ${GITHUB_SHA}. Merge to update the pointer."
          fi
